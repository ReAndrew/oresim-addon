name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setting up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: addon
          path: build/libs/*.jar

      - name: Publish snapshot release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          NOTES="Automatic build of \`${GITHUB_SHA::7}\` from \`main\`.

          Not a stable release - it tracks whatever is on main right now."

          # Recreate rather than edit: `gh release upload --clobber` cannot retarget the tag when
          # main has moved on.
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot "$JAR" \
            --title "Snapshot" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

      # Pushing a tag like v1.1.0+26.3 is enough: this creates the release and attaches the jar.
      # (A release published by hand on the web works too.) A tag with a dash, e.g. v1.2.0-rc1, is a pre-release.
      - name: Create release and attach jar
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          # The tag names the version the jar was built as, e.g. v1.0.0+26.3
          case "$JAR" in
            *"-${TAG#v}.jar") ;;
            *) echo "[ERROR] $JAR does not match the tag $TAG, check mod_version and minecraft" >&2; exit 1 ;;
          esac

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            VERSION="${TAG#v}"
            FLAGS=()
            case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
            gh release create "$TAG" \
              --verify-tag \
              --title "OreSim ${VERSION%%+*} (MC ${VERSION##*+})" \
              --generate-notes "${FLAGS[@]}"
          fi
          gh release upload "$TAG" "$JAR" --clobber

      - name: Publish to the marketplace
        if: (github.event_name == 'release' || github.ref_type == 'tag') && !contains(github.event.release.tag_name || github.ref_name, '-') && vars.MARKETPLACE_ITEM_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ITEM_ID: ${{ vars.MARKETPLACE_ITEM_ID }}
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          CHANGELOG=$(gh release view "$VERSION" --json body --jq .body)
          SOURCE_RELEASE_URL=$(gh release view "$VERSION" --json url --jq .url)
          SOURCE_COMMIT=$(git rev-parse HEAD)
          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }
          # The client unpacks a revision and expects exactly one jar at its root.
          zip -j addon.zip "$JAR"
          # --form-string: -F would read a release body starting with @ as a file path.
          curl --fail-with-body -X POST \
            "https://api.liquidbounce.net/api/v3/marketplace/$ITEM_ID/revisions" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "file=@addon.zip" \
            --form-string "version=$VERSION" \
            --form-string "changelog=$CHANGELOG" \
            --form-string "source_repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --form-string "source_ref=$GITHUB_REF" \
            --form-string "source_commit=$SOURCE_COMMIT" \
            --form-string "source_release_tag=$VERSION" \
            --form-string "source_release_url=$SOURCE_RELEASE_URL" \
            --form-string "source_build_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"